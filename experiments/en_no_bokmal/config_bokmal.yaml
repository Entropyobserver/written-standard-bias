project:
  name: lora-nmt-translation
  seed: 42

model:
  pretrained: facebook/nllb-200-distilled-600M
  src_lang: eng_Latn
  tgt_lang: nob_Latn
  max_length: 128
  dtype: float16

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules: [q_proj, v_proj, k_proj, out_proj]

training:
  epochs: 3
  batch_size: 4
  grad_accumulation: 4
  lr: 5.0e-4
  warmup_steps: 100
  eval_steps: 200
  early_stopping_patience: 3
  fp16: true

generation:
  max_length: 128
  num_beams: 5

evaluation:
  batch_size: 8

data:
  train: data/final_splits_npd_bokmal/train.jsonl
  val:   data/final_splits_npd_bokmal/val.jsonl
  test:  data/final_splits_npd_bokmal/test.jsonl

paths:
  output_dir: outputs
  models_dir: trained_models
  data_dir: .

experiment:
  seeds: [42, 123, 456]
